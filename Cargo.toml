[package]
name = "order_book"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
diesel = { version = "2.2.0", features = ["postgres", "numeric", "chrono", "r2d2"] }
r2d2 = "0.8"
bigdecimal = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
